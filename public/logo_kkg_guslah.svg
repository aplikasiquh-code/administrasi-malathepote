<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background glow / gradient definitions -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EED76A" />
      <stop offset="40%" stop-color="#E2C143" />
      <stop offset="100%" stop-color="#CCA62B" />
    </linearGradient>
    
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="60%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#FFEB3B" />
    </linearGradient>

    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>

    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F9E27C" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AC943" />
      <stop offset="100%" stop-color="#44881A" />
    </linearGradient>

    <filter id="petalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#718096" flood-opacity="0.25" />
    </filter>
    
    <filter id="subtleShade" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- Arc Path for Top Text "MALATHE POTE" -->
    <path id="textArcTop" d="M 100,270 A 205,205 0 0,1 500,270" fill="none" />
    
    <!-- Arc Path for Banner Text "KKG GUSLAH 1" -->
    <path id="textArcBanner" d="M 120,446 Q 300,346 480,446" fill="none" />
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="600" height="600" fill="#FFFFFF" rx="24" />

  <!-- ===================================================================
       1. TOP ARCHED TEXT: "MALATHE POTE"
       =================================================================== -->
  <text font-family="Arial, 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="#58A825" letter-spacing="9">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      MALATHE POTE
    </textPath>
  </text>

  <!-- ===================================================================
       2. BLACK RIBBON TAILS (AT THE BOTTOM SIDES)
       =================================================================== -->
  <!-- Left black ribbon tail -->
  <path d="M 175,410 L 140,510 L 175,490 L 210,510 L 195,435 Z" fill="#000000" />
  <!-- Right black ribbon tail -->
  <path d="M 425,410 L 390,435 L 405,510 L 440,490 L 475,510 Z" fill="#000000" />

  <!-- ===================================================================
       3. MAIN BLACK CIRCULAR RING
       =================================================================== -->
  <circle cx="300" cy="275" r="176" fill="none" stroke="#000000" stroke-width="26" />
  <!-- Inner White Disc Fill -->
  <circle cx="300" cy="275" r="162" fill="#FFFFFF" />

  <!-- ===================================================================
       4. TOP CENTER CARE/EDUCATION EMBLEM (Golden Sun, Hands, Student)
       =================================================================== -->
  <g transform="translate(300, 128) scale(0.95)">
    <!-- Radiating Sun Rays -->
    <g stroke="#F5A623" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-28" x2="0" y2="-38" />
      <line x1="-15" y1="-24" x2="-22" y2="-33" />
      <line x1="15" y1="-24" x2="22" y2="-33" />
      <line x1="-26" y1="-12" x2="-36" y2="-17" />
      <line x1="26" y1="-12" x2="36" y2="-17" />
      <line x1="-30" y1="2" x2="-40" y2="3" />
      <line x1="30" y1="2" x2="40" y2="3" />
    </g>
    
    <!-- Sun Disc Background -->
    <circle cx="0" cy="-4" r="26" fill="url(#sunGlow)" />
    
    <!-- Cupped Golden Hands (Bottom of Emblem) -->
    <path d="M -22,12 C -18,22 18,22 22,12 C 16,18 -16,18 -22,12 Z" fill="#D9822B" />
    <path d="M -24,4 C -22,18 -4,26 0,26 C 4,26 22,18 24,4 C 18,12 8,14 0,14 C -8,14 -18,12 -24,4 Z" fill="#F5A623" />
    
    <!-- Student / Mortarboard / Wings Figure in Blue -->
    <ellipse cx="0" cy="-14" rx="14" ry="5" fill="#0288D1" />
    <polygon points="0,-20 18,-14 0,-8 -18,-14" fill="#0277BD" />
    <path d="M -14,-10 C -6,-2 -2,-4 0,-4 C 2,-4 6,-2 14,-10 C 8,-6 2,-6 0,-6 C -2,-6 -8,-6 -14,-10 Z" fill="#03A9F4" />
    <circle cx="0" cy="-8" r="4.5" fill="#FFFFFF" />
    <circle cx="0" cy="-8" r="3" fill="#0288D1" />
  </g>

  <!-- ===================================================================
       5. OPEN BOOK (Buku Terbuka Pendidikan)
       =================================================================== -->
  <g id="openBook">
    <!-- Orange / Tan Outer Cover Border -->
    <path d="M 180,175 Q 240,165 300,188 Q 360,165 420,175 L 420,335 Q 360,322 300,345 Q 240,322 180,335 Z" 
          fill="none" stroke="#D4843E" stroke-width="7" stroke-linejoin="round" />

    <!-- Left Book Page Fill & Contour -->
    <path d="M 300,186 Q 242,166 190,176 L 190,328 Q 242,318 300,338 Z" 
          fill="#FFFFFF" stroke="#52A829" stroke-width="7" stroke-linejoin="round" />
    <!-- Left Page Inner Contour (Page Depth) -->
    <path d="M 300,200 Q 246,182 202,190 L 202,316 Q 246,308 300,326" 
          fill="none" stroke="#52A829" stroke-width="3" stroke-linecap="round" />
    <path d="M 300,214 Q 250,198 214,204" 
          fill="none" stroke="#71C73E" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Book Page Fill & Contour -->
    <path d="M 300,186 Q 358,166 410,176 L 410,328 Q 358,318 300,338 Z" 
          fill="#FFFFFF" stroke="#52A829" stroke-width="7" stroke-linejoin="round" />
    <!-- Right Page Inner Contour (Page Depth) -->
    <path d="M 300,200 Q 354,182 398,190 L 398,316 Q 354,308 300,326" 
          fill="none" stroke="#52A829" stroke-width="3" stroke-linecap="round" />
    <path d="M 300,214 Q 350,198 386,204" 
          fill="none" stroke="#71C73E" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- ===================================================================
       6. CENTER FLAME, WINGS & GOLDEN PEN
       =================================================================== -->
  <g id="centerTorch" transform="translate(300, 240)">
    <!-- Stylized Blue Wings (Expanding Left & Right) -->
    <!-- Left Wing -->
    <path d="M -4, -6 C -18,-18 -38,-14 -52,-2 C -38,-2 -26,8 -4,6 Z" fill="url(#wingGrad)" />
    <path d="M -6, 2 C -24,-2 -38,8 -46,18 C -32,14 -20,16 -6,10 Z" fill="#03A9F4" />
    <path d="M -4, 8 C -16,10 -26,20 -32,28 C -22,22 -14,20 -4,14 Z" fill="#0288D1" />
    
    <!-- Right Wing -->
    <path d="M 4, -6 C 18,-18 38,-14 52,-2 C 38,-2 26,8 4,6 Z" fill="url(#wingGrad)" />
    <path d="M 6, 2 C 24,-2 38,8 46,18 C 32,14 20,16 6,10 Z" fill="#03A9F4" />
    <path d="M 4, 8 C 16,10 26,20 32,28 C 22,22 14,20 4,14 Z" fill="#0288D1" />

    <!-- Torch Flame (Api Semangat Belajar) -->
    <path d="M 0,-6 C -12,-16 -10,-32 0,-44 C 10,-32 12,-16 0,-6 Z" fill="url(#flameGrad)" filter="url(#subtleShade)" />
    <path d="M 0,-10 C -6,-18 -5,-28 0,-34 C 5,-28 6,-18 0,-10 Z" fill="#FFEE58" />

    <!-- Golden Fountain Pen (Ujung Pena Emas Menghadap Bawah) -->
    <path d="M -6,-2 L 6,-2 L 5,36 L 0,54 L -5,36 Z" fill="url(#penGrad)" stroke="#9A7B1C" stroke-width="1.5" />
    <!-- Pen Slit & Nib Hole -->
    <circle cx="0" cy="28" r="2" fill="#3E2723" />
    <line x1="0" y1="28" x2="0" y2="52" stroke="#3E2723" stroke-width="1.5" />
  </g>

  <!-- ===================================================================
       7. WHITE JASMINE FLOWERS & GREEN LEAVES ("MALATHE POTE")
       Left Cluster & Right Cluster
       =================================================================== -->
  
  <!-- LEFT CLUSTER -->
  <g id="leftJasmineGroup">
    <!-- Green Leaves Behind Flowers -->
    <path d="M 120,240 Q 80,210 60,180 Q 90,195 120,240 Z" fill="url(#leafGrad)" stroke="#387014" stroke-width="1.5" />
    <path d="M 140,290 Q 90,300 65,335 Q 95,335 140,290 Z" fill="url(#leafGrad)" stroke="#387014" stroke-width="1.5" />
    <path d="M 110,180 Q 80,140 100,105 Q 120,135 110,180 Z" fill="url(#leafGrad)" stroke="#387014" stroke-width="1.5" />
    <path d="M 160,370 Q 110,400 95,440 Q 135,420 160,370 Z" fill="url(#leafGrad)" stroke="#387014" stroke-width="1.5" />
    <path d="M 155,140 Q 170,95 205,80 Q 195,115 155,140 Z" fill="url(#leafGrad)" stroke="#387014" stroke-width="1.5" />

    <!-- Flower 1: Upper Left (Open Bloom) -->
    <g transform="translate(100, 205) scale(0.9)" filter="url(#petalShadow)">
      <!-- 5 White Petals with Gentle Gradients -->
      <path d="M 0,0 C -12,-24 12,-24 0,0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C 24,-12 24,12 0,0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C 14,24 -10,26 0,0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C -24,14 -24,-10 0,0" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C -18,-18 -4,-28 0,0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <!-- Golden Stamen Center -->
      <circle cx="0" cy="0" r="4.5" fill="#F59E0B" />
      <circle cx="0" cy="0" r="2.5" fill="#FDE047" />
    </g>

    <!-- Flower 2: Mid Left (Large Bloom) -->
    <g transform="translate(105, 290) scale(1.15)" filter="url(#petalShadow)">
      <path d="M 0,0 C -15,-28 15,-28 0,0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M 0,0 C 28,-14 28,14 0,0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M 0,0 C 16,28 -12,28 0,0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M 0,0 C -28,16 -28,-12 0,0" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M 0,0 C -20,-20 -5,-30 0,0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="0" cy="0" r="5" fill="#D97706" />
      <circle cx="0" cy="0" r="3" fill="#FBBF24" />
    </g>

    <!-- Flower 3: Lower Left -->
    <g transform="translate(145, 360) scale(0.95)" filter="url(#petalShadow)">
      <path d="M 0,0 C -14,-25 14,-25 0,0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C 25,-12 25,12 0,0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C 14,25 -10,25 0,0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C -25,14 -25,-10 0,0" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4.5" fill="#F59E0B" />
      <circle cx="0" cy="0" r="2.5" fill="#FDE047" />
    </g>

    <!-- Jasmine Bud (Top) -->
    <g transform="translate(130, 155) rotate(-30) scale(0.8)">
      <path d="M 0,0 Q -8,-16 0,-24 Q 8,-16 0,0 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M -4,0 Q -8,-8 0,-14 Q 4,-4 4,0 Z" fill="#7AC943" />
    </g>
  </g>

  <!-- RIGHT CLUSTER (Symmetrical to Left) -->
  <g id="rightJasmineGroup">
    <!-- Green Leaves Behind Flowers -->
    <path d="M 480,240 Q 520,210 540,180 Q 510,195 480,240 Z" fill="url(#leafGrad)" stroke="#387014" stroke-width="1.5" />
    <path d="M 460,290 Q 510,300 535,335 Q 505,335 460,290 Z" fill="url(#leafGrad)" stroke="#387014" stroke-width="1.5" />
    <path d="M 490,180 Q 520,140 500,105 Q 480,135 490,180 Z" fill="url(#leafGrad)" stroke="#387014" stroke-width="1.5" />
    <path d="M 440,370 Q 490,400 505,440 Q 465,420 440,370 Z" fill="url(#leafGrad)" stroke="#387014" stroke-width="1.5" />
    <path d="M 445,140 Q 430,95 395,80 Q 405,115 445,140 Z" fill="url(#leafGrad)" stroke="#387014" stroke-width="1.5" />

    <!-- Flower 1: Upper Right -->
    <g transform="translate(500, 205) scale(0.9)" filter="url(#petalShadow)">
      <path d="M 0,0 C -12,-24 12,-24 0,0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C 24,-12 24,12 0,0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C 14,24 -10,26 0,0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C -24,14 -24,-10 0,0" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C 18,-18 4,-28 0,0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4.5" fill="#F59E0B" />
      <circle cx="0" cy="0" r="2.5" fill="#FDE047" />
    </g>

    <!-- Flower 2: Mid Right (Large Bloom) -->
    <g transform="translate(495, 290) scale(1.15)" filter="url(#petalShadow)">
      <path d="M 0,0 C -15,-28 15,-28 0,0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M 0,0 C 28,-14 28,14 0,0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M 0,0 C 16,28 -12,28 0,0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M 0,0 C -28,16 -28,-12 0,0" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M 0,0 C 20,-20 5,-30 0,0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="0" cy="0" r="5" fill="#D97706" />
      <circle cx="0" cy="0" r="3" fill="#FBBF24" />
    </g>

    <!-- Flower 3: Lower Right -->
    <g transform="translate(455, 360) scale(0.95)" filter="url(#petalShadow)">
      <path d="M 0,0 C -14,-25 14,-25 0,0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C 25,-12 25,12 0,0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C 14,25 -10,25 0,0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 0,0 C -25,14 -25,-10 0,0" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4.5" fill="#F59E0B" />
      <circle cx="0" cy="0" r="2.5" fill="#FDE047" />
    </g>

    <!-- Jasmine Bud (Top) -->
    <g transform="translate(470, 155) rotate(30) scale(0.8)">
      <path d="M 0,0 Q -8,-16 0,-24 Q 8,-16 0,0 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M 4,0 Q 8,-8 0,-14 Q -4,-4 -4,0 Z" fill="#7AC943" />
    </g>
  </g>

  <!-- ===================================================================
       8. GOLDEN CURVED BANNER RIBBON ("KKG GUSLAH 1")
       =================================================================== -->
  <g id="bottomBanner" filter="url(#subtleShade)">
    <!-- Golden Banner Body -->
    <!-- Curved Ribbon Path matching photo.jpg -->
    <path d="M 95,450 Q 300,345 505,450 
             L 525,485 Q 300,380 75,485 Z" 
          fill="url(#goldRibbon)" 
          stroke="#B48F1E" 
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- Left Ribbon Fold End -->
    <path d="M 75,485 L 115,447 L 95,450 Z" fill="#997715" />
    <path d="M 75,485 L 125,520 L 110,480 Z" fill="url(#goldRibbon)" stroke="#B48F1E" stroke-width="2" />

    <!-- Right Ribbon Fold End -->
    <path d="M 525,485 L 485,447 L 505,450 Z" fill="#997715" />
    <path d="M 525,485 L 475,520 L 490,480 Z" fill="url(#goldRibbon)" stroke="#B48F1E" stroke-width="2" />

    <!-- Inner gold border line for premium badge effect -->
    <path d="M 102,456 Q 300,353 498,456" fill="none" stroke="#FFF59D" stroke-width="2" opacity="0.8" />
    <path d="M 84,480 Q 300,375 516,480" fill="none" stroke="#B48F1E" stroke-width="1.5" opacity="0.6" />

    <!-- Banner Text: "KKG GUSLAH 1" in Green -->
    <text font-family="'Arial Black', Arial, 'Montserrat', sans-serif" font-weight="900" font-size="35" fill="#4B961D" letter-spacing="6">
      <textPath href="#textArcBanner" startOffset="50%" text-anchor="middle">
        KKG GUSLAH I
      </textPath>
    </text>
  </g>

</svg>
